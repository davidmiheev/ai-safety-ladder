[project]
name = "ai-safety-ladder"
version = "0.1.0"
description = "Hands-on AI safety & interpretability experiments, worked through as a ladder."
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "transformer-lens>=2.16,<4",  # 4.x drops HookedTransformer, which ARENA/SAELens/YSDA still use
    "circuitsvis>=1.43",
    "sae-lens>=6.0",
    "nnsight>=0.4",
    "torch>=2.4",
    "numpy",
    "matplotlib",
    "plotly",
    "python-dotenv",
]

[project.optional-dependencies]
notebooks = ["jupyterlab", "ipykernel", "ipywidgets"]

[dependency-groups]
dev = ["pytest", "ruff"]
docs = ["typst>=0.13"]  # renders writeups/*.typ -> PDF (scripts/build_writeups.py)

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ladder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: downloads model weights (deselect with -m 'not slow')"]

[tool.ruff]
line-length = 100

[tool.uv]
default-groups = ["dev", "docs"]
